  <!-- eyes -->
  <circle cx="16" cy="18" r="3.5" fill="#c9504f"/>
  <circle cx="24" cy="18" r="3.5" fill="#c9504f"/>
  <circle cx="17" cy="17" r="1.2" fill="#fff"/>
  <circle cx="25" cy="17" r="1.2" fill="#fff"/>
  <!-- smile -->
