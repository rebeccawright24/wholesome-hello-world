<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 32" role="img" aria-label="A little fly">
  <!-- wings -->
  <ellipse cx="13" cy="9" rx="9" ry="6" fill="#d6ecf5" fill-opacity="0.85" stroke="#9cc3d3" stroke-width="1" transform="rotate(-25 13 9)"/>
  <ellipse cx="27" cy="9" rx="9" ry="6" fill="#d6ecf5" fill-opacity="0.85" stroke="#9cc3d3" stroke-width="1" transform="rotate(25 27 9)"/>
  <!-- body -->
