<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catch the Flies!</title>
  <!-- The ?v= number makes browsers fetch the newest file. Bump it whenever style.css or script.js changes. -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <!-- The game area. script.js adds the webs, spiders and flies here. -->
  <div class="playfield" id="playfield"></div>

  <!-- The start screen, shown before the game begins -->
  <main class="start-screen">
    <h1>Catch the Flies! 🕷️</h1>
    <p>Swing the spider to catch all three flies. Every level the flies get faster and the spider gets a little heavier.</p>
    <div class="menu" id="menu">
      <button id="solo" class="start">Play solo</button>
      <button id="host" class="secondary">Host an online game</button>
      <div class="join">
        <input id="code" type="text" placeholder="CODE" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code">
        <button id="join" class="secondary">Join</button>
      </div>
    </div>
    <p class="status" id="status" aria-live="polite"></p>
    <p class="hint">◀ ▶ swing &nbsp;·&nbsp; ▲ ▼ climb<br>Use the arrow keys or the buttons on screen.</p>
  </main>

  <!-- Level and scores, shown while playing -->
  <div class="hud" id="hud" aria-live="polite"></div>

  <!-- Big messages like "Level 2!" -->
  <div class="banner" id="banner" aria-live="polite"></div>

  <!-- On-screen arrow buttons, for phones -->
  <div class="controls" aria-label="Spider controls">
    <button class="up" data-dir="up" aria-label="Climb up">▲</button>
    <button class="left" data-dir="left" aria-label="Swing left">◀</button>
    <button class="down" data-dir="down" aria-label="Climb down">▼</button>
    <button class="right" data-dir="right" aria-label="Swing right">▶</button>
  </div>

  <!-- PeerJS: a free library that connects two browsers for online play -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
