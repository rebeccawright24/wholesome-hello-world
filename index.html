<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wholesome Hello World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="spider" id="spider">
    <img src="images/spider.svg" alt="A cute smiling spider hanging from a thread">
  </div>
  <main>
    <img src="images/sprout.svg" alt="A smiling sun above a little green sprout" class="hero">
    <h1>Hello, world! 🌱</h1>
    <p>This is my very first website. I'm Rebecca, and I'm learning to build things.</p>
    <button id="wave">Say hello back</button>
    <p id="reply"></p>
    <p class="hint">Tip: use the arrow keys on your keyboard to move the spider 🕷️</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
